<body>

<div class="card">

<h1>Password Generator</h1>

<p>Create a strong, secure password in seconds.</p>

<label for="length">Password Length</label>

<input
type="range"
id="length"
min="8"
max="64"
value="16">

<p><strong><span id="lengthValue">16</span></strong> Characters</p>

<label><input type="checkbox" id="uppercase" checked> Include Uppercase Letters</label>

<label><input type="checkbox" id="lowercase" checked> Include Lowercase Letters</label>

<label><input type="checkbox" id="numbers" checked> Include Numbers</label>

<label><input type="checkbox" id="symbols" checked> Include Symbols</label>

<button onclick="generatePassword()">
Generate Password
</button>

<input
id="password"
readonly
placeholder="Your password will appear here">

<button onclick="copyPassword()">
Copy Password
</button>
