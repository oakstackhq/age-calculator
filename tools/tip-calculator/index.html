<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip Calculator | OakStack HQ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <h1>Tip Calculator</h1>

  <label>Bill Amount ($)</label>
  <input type="number" id="bill" placeholder="100.00">

  <label>Tip Percentage (%)</label>
  <input type="number" id="tip" placeholder="20">

  <button onclick="calculateTip()">Calculate</button>

  <h2 id="result"></h2>

  <p><a href="/">← Back to OakStack HQ</a></p>
</div>

<script src="script.js"></script>

</body>
</html>
