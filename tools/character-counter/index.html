<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Character Counter - Free Online Character Counter | OakStack HQ</title>

<meta name="description"
content="Free online character counter. Count characters with and without spaces instantly.">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Character Counter</h1>

<p class="subtitle">
Count characters instantly as you type or paste text.
</p>

<textarea
id="text"
placeholder="Type or paste your text here..."></textarea>

<div class="stats">

<div class="stat">
<h2 id="characters">0</h2>
<p>Characters</p>
</div>

<div class="stat">
<h2 id="noSpaces">0</h2>
<p>Without Spaces</p>
</div>

<div class="stat">
<h2 id="letters">0</h2>
<p>Letters</p>
</div>

<div class="stat">
<h2 id="numbers">0</h2>
<p>Numbers</p>
</div>

<div class="stat">
<h2 id="spaces">0</h2>
<p>Spaces</p>
</div>

<div class="stat">
<h2 id="lines">0</h2>
<p>Lines</p>
</div>

</div>

<div class="related">

</div>

</div>

</div>

</html>
