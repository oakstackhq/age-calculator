<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Case Converter | OakStack HQ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Text Case Converter</h1>

    <textarea id="text" placeholder="Paste your text here..."></textarea>

    <div class="buttons">
        <button onclick="upper()">UPPERCASE</button>
        <button onclick="lower()">lowercase</button>
        <button onclick="titleCase()">Title Case</button>
        <button onclick="sentenceCase()">Sentence case</button>
        <button onclick="copyText()">Copy</button>
    </div>

    <a class="back" href="/">← Back to OakStack HQ</a>
</div>

<script src="script.js"></script>

</body>
</html>
