<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Word Counter - Free Online Word Counter | OakStack HQ</title>

<meta name="description" content="Free online word counter. Instantly count words, characters, sentences, paragraphs, and estimated reading time.">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Word Counter</h1>

<p>Count words, characters, sentences, paragraphs and reading time.</p>

<textarea
id="text"
placeholder="Paste or type your text..."></textarea>

<div class="stats">

<div class="stat">
<h2 id="words">0</h2>
<p>Words</p>
</div>

<div class="stat">
<h2 id="characters">0</h2>
<p>Characters</p>
</div>

<div class="stat">
<h2 id="charactersNoSpaces">0</h2>
<p>No Spaces</p>
</div>

<div class="stat">
<h2 id="sentences">0</h2>
<p>Sentences</p>
</div>

<div class="stat">
<h2 id="paragraphs">0</h2>
<p>Paragraphs</p>
</div>

<div class="stat">
<h2 id="reading">0 min</h2>
<p>Reading Time</p>
</div>

</div>
