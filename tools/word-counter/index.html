<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Word Counter - Free Online Word Counter | OakStack HQ</title>

<meta name="description"
content="Count words, characters, sentences, paragraphs and reading time instantly.">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>Word Counter</h1>

<p class="subtitle">
Paste or type your text below.
</p>

<textarea
id="text"
placeholder="Start typing..."></textarea>

<div class="stats">

<div class="stat">
<h2 id="words">0</h2>
<p>Words</p>
</div>

<div class="stat">
<h2 id="characters">0</h2>
<p>Characters</p>
</div>

<div class="stat">
<h2 id="charactersNoSpaces">0</h2>
<p>No Spaces</p>
</div>

<div class="stat">
<h2 id="sentences">0</h2>
<p>Sentences</p>
</div>

<div class="stat">
<h2 id="paragraphs">0</h2>
<p>Paragraphs</p>
</div>

<div class="stat">
<h2 id="reading">0 min</h2>
<p>Reading Time</p>
</div>

</div>

<div class="related">

<h3>Related Tools</h3>

<div class="related-grid">

<a href="/tools/password-generator/">Password Generator</a>

<a href="/tools/qr-code-generator/">QR Code Generator</a>

<a href="/tools/age-calculator/">Age Calculator</a>

</div>

</div>

← Back to OakStack HQ
</a>

</div>

<script src="script.js"></script>

</body>
</html>
